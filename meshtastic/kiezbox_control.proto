syntax = "proto3";

package meshtastic;

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "KiezboxControl";
option java_package = "com.geeksville.mesh";
option swift_prefix = "";

/*
 * This message is used for
 * KIEZBOX_CONTROL_APP PortNums.
 */
message KiezboxMessage {
  // Port number used for kiezbox messages
  // Taken from the private range (256-511) of meshtastic.PortNum, so it is
  // not registered upstream and portnums.proto stays unmodified
  enum PortNum {
    UNKNOWN_APP = 0;
    KIEZBOX_CONTROL_APP = 258;
  }
  // Meta information identifying the box
  // Also used as tags in the Database
  message Meta {
    // ID if the Kiezbox
    optional uint32 box_id = 1; // only 8 bit used
    // ID of the district the box is assigned to
    optional uint32 dist_id = 2; // only 8 bit used
    // Formerly sens_id of the removed sensor boxes
    reserved 3;
    // Which type of device the controller should be
    optional DeviceType dev_type = 4;
  }
  // Modes a kiezbox can be in
  enum Mode {
    maintenance = 0;
    normal = 1;
    emergency = 2;
  }
  // Device Type of the kiezbox
  enum DeviceType {
    // A core control module
    core = 0;
    // A dedicated sensor box
    sensor = 1;
    // A info dipslay
    display = 2;
    // The emergency button
    button = 3;
  }
  // Persistent configuration of the kiezbox control module
  // Stored by the firmware in its own file, independent of the upstream module config
  message Config {
    // Whether the module is enabled
    bool enabled = 1;
    // Interval (in milliseconds) at which a status update should be sent
    int32 status_interval = 2;
    // Formerly power_pin_override, the power pin is fixed by the variant
    reserved 3;
    // ID of the kiezbox
    int32 box_id = 4;
    // ID of the district
    int32 dist_id = 5;
    // Formerly sens_id of the removed sensor boxes
    reserved 6;
    // Power state target of the connected router
    bool router_power = 7;
    // Mode target for this kiezbox core (and connected router)
    Mode mode = 8;
    // Device type of this kiezbox
    DeviceType dev_type = 9;
    // Formerly sds_warmup_time of the removed sensor boxes
    reserved 10;
    // ID of the emergency button
    int32 button_id = 11;
  }
  // Messages to control one or multiple boxes
  // The meta field is used to filter for boxes to target
  // Request messages can be used to request a specific response/update from a set of boxes
  message Request {
    Meta meta = 1;
    optional Type type = 2;
    enum Type {
      Update = 0;
      // Request the current module config, answered with a config message
      GetConfig = 1;
    }
  }
  // Control messages can be used to set a variable or other parameter for a set of boxes
  message Control {
    // Formerly sens_id and sds_warmup_time of the removed sensor boxes
    reserved 7, 9;
    Meta meta = 1;
    oneof set {
        Mode mode = 2;
        int64 unix_time = 3;
        bool router_power = 4;
        uint32 box_id = 5;
        uint32 dist_id = 6;
        int32 status_interval = 8;
        bool enabled = 10;
        DeviceType dev_type = 11;
        int32 button_id = 12;
        // Replace the whole module config
        Config config = 13;
    }
  }
  // Periodic update message containing core data
  message Update {
    Meta meta = 1;
    // Unix timestamp ( in seconds ), when the measurements were taken
    int64 unix_time = 2;
    optional Core core = 3;
    // Formerly the values of the removed sensor boxes
    reserved 4;
    // Unix timestamp ( in seconds ), when the measurements arrived at the database gateway
    optional int64 arrival_time = 5;
  }
  // Contains general router status and internal sensor values
  message Core {
    Mode mode = 1;
    Router router = 2;
    CoreValues values = 3;
  }
  // Router status information
  message Router {
    // True if power is supplied to the router
    bool powered = 1;
    // Router firmware software version
    // For OpenWrt this would be VERSION="23.05.2"
    optional string sw_version = 2;
    // Router model name
    optional string model = 3;
  }
  // Sensor values measured at the core
  message CoreValues {
    // Formerly temp_out, temp_in and humid_in of the removed DS18B20 and DHT22
    reserved 1 to 3;
    // Voltage of the solar panel (V)
    optional int32 solar_voltage = 4;
    // Power output of the solar panel (W)
    optional int32 solar_power = 5;
    // Energy collected by the solar panel today (Wh)
    optional int32 solar_energy_day = 6;
    // Energy collected by the solar panel in total (Wh)
    optional int32 solar_energy_total = 7;
    // Voltage of the (main) battery (V)
    optional int32 battery_voltage = 8;
    // Current of the (main) battery (A)
    optional int32 battery_current = 9;
    // Temperature of the realtime clock (C)
    optional int32 temp_rtc = 10;
  }
  message Emergency {
    // Type of the emergency
    EmergencyType type = 1;
    // ID of the button sending the emergency
    int32 button_id = 2;
    // Unix timestamp ( in seconds ), when the emergency happend
    int64 unix_time = 3;
    // Optional message describing what happened
    optional string message = 4;
  }
  enum EmergencyType {
    // Medical emergency
    medical = 0;
    // Fire emergency
    fire = 1;
    // Crime emergency
    crime = 2;
    // Sick emergency
    sick = 3;
    // Help emergency
    help = 4;
  }
  optional Update update = 4;
  optional Control control = 5;
  optional Emergency distress = 6;
  optional Request request = 7;
  // Current module config, sent in response to a GetConfig request
  optional Config config = 8;
}
